<svg xmlns="http://www.w3.org/2000/svg" width="44" height="24" viewBox="0 0 44 24">
  <!-- Sunglasses on her eyes (5 × 13, 13 apart): the lenses are tinted, not
       black, so her eyes —her whole face— still read through them. -->
  <g id="arms">
    <path d="M9.4 8 L3.5 6.8" fill="none" stroke="#2a2e33" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M34.6 8 L40.5 6.8" fill="none" stroke="#2a2e33" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g id="lenses">
    <path d="M9 5 h13 v8 a5.5 5.5 0 0 1 -5.5 5.5 h-2 a5.5 5.5 0 0 1 -5.5 -5.5 z" fill="#0e1012" fill-opacity="0.58" stroke="#2a2e33" stroke-width="1.6"/>
    <path d="M22 5 h13 v8 a5.5 5.5 0 0 1 -5.5 5.5 h-2 a5.5 5.5 0 0 1 -5.5 -5.5 z" fill="#0e1012" fill-opacity="0.58" stroke="#2a2e33" stroke-width="1.6"/>
    <path d="M11.5 7.5 L14.5 7.5 M24.5 7.5 L27.5 7.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
