<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Old portable-player headphones: a thin band and two foam pads. -->
  <g id="band">
    <path d="M8 33 A24 24 0 0 1 56 33" fill="none" stroke="#c8d3cd" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g id="pads">
    <circle cx="8" cy="35" r="7.2" fill="#e8875a"/>
    <circle cx="56" cy="35" r="7.2" fill="#e8875a"/>
    <circle cx="8" cy="35" r="3.6" fill="#c96f4c"/>
    <circle cx="56" cy="35" r="3.6" fill="#c96f4c"/>
  </g>
</svg>
