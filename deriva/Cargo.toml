[package]
name = "deriva-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deriva's local library worker for storing, searching, and retrieving captures."

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
#  Semantic similarity, with `local-only`.
#
#  Without this flag the crate includes `hf-hub` and `ureq`, which can download
#  models from the internet and would contradict the README's claim that the
#  worker makes no network connections. The host downloads the model; this
#  worker only reads it from a directory.
#
#  Use `fancy-regex` instead of `onig` because `onig` is written in C and would
#  require system dependencies to build this binary.
model2vec-rs = { version = "0.2", default-features = false, features = ["local-only", "fancy-regex"] }

[profile.release]
opt-level = 2
strip = true
